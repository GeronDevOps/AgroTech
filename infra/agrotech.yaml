AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  AgroTech (AGRO-16) - Entorno de produccion segun el diagrama de despliegue (Entrega 3):
  ALB HTTPS/WSS -> EC2 (Node.js 22, API + WebSocket + tareas) -> RDS PostgreSQL 17 + PostGIS en subred privada;
  fotos en S3 (lectura publica solo de productos/); secretos en SSM Parameter Store y Secrets Manager.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: General }
        Parameters: [Entorno, CertificadoArn, CorreoAlertas]
      - Label: { default: Computo y base de datos }
        Parameters: [TipoInstancia, AmiUbuntu, ClaseRds, AlmacenamientoRdsGb]
      - Label: { default: Despliegue continuo (GitHub Actions con OIDC) }
        Parameters: [RepositorioGitHub, CrearProveedorOidc]

Parameters:
  Entorno:
    Type: String
    Default: produccion
    AllowedValues: [produccion, pruebas]
    Description: Prefijo de los recursos y de los parametros en SSM (/agrotech/<entorno>/...).
  CertificadoArn:
    Type: String
    AllowedPattern: '^arn:aws:acm:[a-z0-9-]+:\d{12}:certificate/[a-f0-9-]+$'
    Description: Certificado de ACM (misma region) para el dominio de la API, p. ej. api.agrotech.co.
  CorreoAlertas:
    Type: String
    Default: ''
    Description: Correo que recibe las alarmas de CloudWatch (vacio = sin suscripcion).
  TipoInstancia:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small, t3.medium]
  AmiUbuntu:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  ClaseRds:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t4g.micro, db.t3.small]
  AlmacenamientoRdsGb:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100
  RepositorioGitHub:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
    Description: owner/repo autorizado a desplegar (vacio = sin rol de despliegue).
  CrearProveedorOidc:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: false si la cuenta ya tiene el proveedor OIDC token.actions.githubusercontent.com.

Conditions:
  ConAlertasCorreo: !Not [!Equals [!Ref CorreoAlertas, '']]
  ConGitHub: !Not [!Equals [!Ref RepositorioGitHub, '']]
  CrearOidc: !And [!Condition ConGitHub, !Equals [!Ref CrearProveedorOidc, 'true']]
  EsProduccion: !Equals [!Ref Entorno, produccion]

Resources:
  # ---------------------------------------------------------------- Red (VPC con 2 zonas: el ALB y RDS lo exigen)
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub 'agrotech-${Entorno}' }]
  PuertaInternet:
    Type: AWS::EC2::InternetGateway
  UnionPuerta:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref PuertaInternet }

  SubredPublicaA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub 'agrotech-${Entorno}-publica-a' }]
  SubredPublicaB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub 'agrotech-${Entorno}-publica-b' }]
  SubredPrivadaA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub 'agrotech-${Entorno}-privada-a' }]
  SubredPrivadaB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub 'agrotech-${Entorno}-privada-b' }]

  TablaPublica:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  RutaInternet:
    Type: AWS::EC2::Route
    DependsOn: UnionPuerta
    Properties: { RouteTableId: !Ref TablaPublica, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref PuertaInternet }
  AsocPublicaA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubredPublicaA, RouteTableId: !Ref TablaPublica }
  AsocPublicaB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubredPublicaB, RouteTableId: !Ref TablaPublica }
  # Las subredes privadas no tienen salida a internet: solo alojan RDS.
  TablaPrivada:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  AsocPrivadaA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubredPrivadaA, RouteTableId: !Ref TablaPrivada }
  AsocPrivadaB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubredPrivadaB, RouteTableId: !Ref TablaPrivada }
  # Acceso a S3 sin pasar por internet desde la VPC.
  PuntoS3:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref TablaPublica, !Ref TablaPrivada]

  # ---------------------------------------------------------------- Grupos de seguridad (minimo privilegio en red)
  SgBalanceador:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - HTTPS/WSS publico y redireccion de HTTP
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
  SgApi:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EC2 - solo el ALB llega al puerto 3000; sin SSH (acceso por SSM Session Manager)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 3000, ToPort: 3000, SourceSecurityGroupId: !Ref SgBalanceador }
  SgBaseDatos:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS - solo la API llega a PostgreSQL
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref SgApi }

  # ---------------------------------------------------------------- Almacenamiento S3
  BucketImagenes:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'agrotech-imagenes-${Entorno}-${AWS::AccountId}'
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false # la politica de abajo publica solo productos/
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules: [{ AllowedMethods: [GET, HEAD], AllowedOrigins: ['*'], MaxAge: 86400 }]
  PoliticaImagenes:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketImagenes
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: LecturaPublicaDeFotosDeProductos
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${BucketImagenes.Arn}/productos/*'
          - Sid: SoloHttps
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt BucketImagenes.Arn, !Sub '${BucketImagenes.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }

  BucketDespliegues:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'agrotech-despliegues-${Entorno}-${AWS::AccountId}'
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules: [{ Id: VersionesViejas, Status: Enabled, Prefix: versiones/, ExpirationInDays: 90 }]

  # ---------------------------------------------------------------- Base de datos (RDS PostgreSQL 17 + PostGIS)
  SecretoBaseDatos:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '/agrotech/${Entorno}/rds'
      Description: Usuario maestro de RDS (lo lee cargar-entorno.sh al arrancar la API)
      GenerateSecretString:
        SecretStringTemplate: '{"username":"agrotech_admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
  SubredesBaseDatos:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subredes privadas de AgroTech
      SubnetIds: [!Ref SubredPrivadaA, !Ref SubredPrivadaB]
  ParametrosBaseDatos:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: postgres17
      Description: AgroTech - TLS obligatorio y zona horaria UTC
      Parameters:
        rds.force_ssl: '1'
        timezone: UTC
        log_min_duration_statement: '500' # RNF-01: registra consultas de mas de 500 ms
  BaseDatos:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub 'agrotech-${Entorno}'
      DBName: agrotech_db
      Engine: postgres
      EngineVersion: '17.11' # verificar con: aws rds describe-db-engine-versions --engine postgres --query 'DBEngineVersions[].EngineVersion'
      DBInstanceClass: !Ref ClaseRds
      AllocatedStorage: !Ref AlmacenamientoRdsGb
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: !Sub '{{resolve:secretsmanager:${SecretoBaseDatos}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${SecretoBaseDatos}:SecretString:password}}'
      DBSubnetGroupName: !Ref SubredesBaseDatos
      DBParameterGroupName: !Ref ParametrosBaseDatos
      VPCSecurityGroups: [!Ref SgBaseDatos]
      PubliclyAccessible: false
      MultiAZ: false # piloto; se activa al crecer (RNF-07)
      BackupRetentionPeriod: 7 # copias diarias automaticas + restauracion a un punto en el tiempo
      PreferredBackupWindow: '07:00-07:30' # 02:00 en Colombia
      PreferredMaintenanceWindow: 'sun:08:00-sun:09:00'
      AutoMinorVersionUpgrade: true
      DeletionProtection: !If [EsProduccion, true, false]
      CopyTagsToSnapshot: true
      EnablePerformanceInsights: false

  # ---------------------------------------------------------------- Computo (EC2 con rol; sin llaves en el servidor)
  RolServidor:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: agrotech-api
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: FotosDeProductos
                Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${BucketImagenes.Arn}/productos/*'
              - Sid: LeerVersiones
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${BucketDespliegues.Arn}/versiones/*'
              - Sid: Configuracion
                Effect: Allow
                Action: [ssm:GetParametersByPath, ssm:GetParameter]
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/agrotech/${Entorno}*'
              - Sid: CredencialesBaseDatos
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SecretoBaseDatos
  PerfilServidor:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref RolServidor] }

  PlantillaServidor:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 1 } # IMDSv2 obligatorio
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            # Preparacion inicial del servidor. El codigo llega despues con infra/servidor/desplegar.sh.
            set -euxo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y ca-certificates curl gnupg jq unzip
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y nodejs
            snap install aws-cli --classic || true
            useradd --system --create-home --home-dir /var/lib/agrotech --shell /usr/sbin/nologin agrotech || true
            install -d -o root -g agrotech -m 750 /srv/agrotech /srv/agrotech/versiones
            install -d -o root -g agrotech -m 750 /etc/agrotech
            curl -fsSL https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem -o /etc/agrotech/rds-ca.pem
            chmod 644 /etc/agrotech/rds-ca.pem
            cat > /etc/agrotech/infra.env <<'EOF'
            ENTORNO=${Entorno}
            AWS_REGION=${AWS::Region}
            FOTOS_S3_BUCKET=${BucketImagenes}
            BUCKET_DESPLIEGUES=${BucketDespliegues}
            DB_HOST=${BaseDatos.Endpoint.Address}
            DB_PUERTO=${BaseDatos.Endpoint.Port}
            DB_NOMBRE=agrotech_db
            SECRETO_RDS=${SecretoBaseDatos}
            EOF
            chmod 640 /etc/agrotech/infra.env
            chgrp agrotech /etc/agrotech/infra.env
  Servidor:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiUbuntu
      InstanceType: !Ref TipoInstancia
      IamInstanceProfile: !Ref PerfilServidor
      SubnetId: !Ref SubredPublicaA
      SecurityGroupIds: [!Ref SgApi]
      LaunchTemplate:
        LaunchTemplateId: !Ref PlantillaServidor
        Version: !GetAtt PlantillaServidor.LatestVersionNumber
      Tags: [{ Key: Name, Value: !Sub 'agrotech-${Entorno}-api' }]

  # ---------------------------------------------------------------- Balanceador (HTTPS/WSS :443, certificado ACM)
  Balanceador:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub 'agrotech-${Entorno}'
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref SubredPublicaA, !Ref SubredPublicaB]
      SecurityGroups: [!Ref SgBalanceador]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: '120' } # el WebSocket envia ping cada 30 s
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
  GrupoDestino:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 3000
      TargetType: instance
      Targets: [{ Id: !Ref Servidor, Port: 3000 }]
      HealthCheckPath: /api/v1/salud # 200 solo si la base de datos responde (RNF-07)
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }
  OyenteHttps:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Balanceador
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificadoArn }]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref GrupoDestino }]
  OyenteHttp:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Balanceador
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: '443', StatusCode: HTTP_301 }

  # ---------------------------------------------------------------- Alarmas (RNF-07 disponibilidad)
  TemaAlertas:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'agrotech-${Entorno}-alertas'
      Subscription: !If [ConAlertasCorreo, [{ Protocol: email, Endpoint: !Ref CorreoAlertas }], !Ref AWS::NoValue]
  AlarmaSinServidorSano:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: La API no responde /salud (o la base de datos no responde)
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - { Name: TargetGroup, Value: !GetAtt GrupoDestino.TargetGroupFullName }
        - { Name: LoadBalancer, Value: !GetAtt Balanceador.LoadBalancerFullName }
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref TemaAlertas]
      OKActions: [!Ref TemaAlertas]
  AlarmaErrores5xx:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Mas de 10 respuestas 5xx de la API en 5 minutos
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions: [{ Name: LoadBalancer, Value: !GetAtt Balanceador.LoadBalancerFullName }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref TemaAlertas]
  AlarmaLatencia:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: p95 de respuesta de la API mayor a 1 s durante 10 minutos (RNF-01)
      Namespace: AWS/ApplicationELB
      MetricName: TargetResponseTime
      Dimensions: [{ Name: LoadBalancer, Value: !GetAtt Balanceador.LoadBalancerFullName }]
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref TemaAlertas]
  AlarmaEspacioRds:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Quedan menos de 2 GB libres en RDS
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions: [{ Name: DBInstanceIdentifier, Value: !Ref BaseDatos }]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      AlarmActions: [!Ref TemaAlertas]
  AlarmaCpuRds:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: CPU de RDS sobre 80 % durante 15 minutos
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions: [{ Name: DBInstanceIdentifier, Value: !Ref BaseDatos }]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref TemaAlertas]

  # ---------------------------------------------------------------- Despliegue continuo desde GitHub (OIDC, sin llaves)
  ProveedorOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: CrearOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  RolDespliegue:
    Type: AWS::IAM::Role
    Condition: ConGitHub
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${RepositorioGitHub}:environment:${Entorno}'
      Policies:
        - PolicyName: agrotech-despliegue
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SubirVersion
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${BucketDespliegues.Arn}/versiones/*'
              - Sid: EjecutarDespliegue
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Servidor}'
                  - !Sub 'arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript'
              - Sid: VerResultado
                Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: '*'

Outputs:
  UrlBalanceador:
    Description: Cree un registro CNAME (p. ej. api.agrotech.co) hacia este nombre
    Value: !GetAtt Balanceador.DNSName
  BucketImagenes:
    Description: FOTOS_S3_BUCKET
    Value: !Ref BucketImagenes
  UrlBaseFotos:
    Description: FOTOS_URL_BASE (las fotos se descargan directo del bucket)
    Value: !Sub 'https://${BucketImagenes}.s3.${AWS::Region}.amazonaws.com'
  BucketDespliegues:
    Value: !Ref BucketDespliegues
  IdServidor:
    Description: 'Instancia EC2 (acceso: aws ssm start-session --target <id>)'
    Value: !Ref Servidor
  ExtremoBaseDatos:
    Value: !GetAtt BaseDatos.Endpoint.Address
  RolDespliegueArn:
    Condition: ConGitHub
    Description: Variable AWS_ROL_DESPLIEGUE del entorno de GitHub
    Value: !GetAtt RolDespliegue.Arn
