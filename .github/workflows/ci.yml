# AGRO-4 — Integración continua
# Se ejecuta en cada push y pull request hacia develop y main.
# Un PR solo puede fusionarse si los trabajos terminan en verde (ver 02_Codigo/agrotech/docs/CONTRIBUTING.md).
# El monorepo vive en 02_Codigo/agrotech: todas las rutas parten de ahí.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (Node.js + PostgreSQL/PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agrotech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/agrotech_test
    defaults:
      run:
        working-directory: 02_Codigo/agrotech/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 02_Codigo/agrotech/api/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Migraciones (con PostGIS real)
        run: npm run migrate
      - name: Pruebas unitarias e integración
        run: npm test -- --ci

  infra:
    name: Infraestructura (CloudFormation y scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: cfn-lint
        run: pip install --quiet cfn-lint && cfn-lint 02_Codigo/agrotech/infra/agrotech.yaml
      - name: shellcheck
        run: shellcheck -x 02_Codigo/agrotech/infra/servidor/*.sh

  app:
    name: App (React Native / Expo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 02_Codigo/agrotech/app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 02_Codigo/agrotech/app/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Pruebas de componentes y navegación
        run: npm test -- --ci
      - name: Compilar bundle Android
        run: npx expo export --platform android --output-dir dist
        env:
          EXPO_OFFLINE: 1
